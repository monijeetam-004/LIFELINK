[project]
name = "lifelink-backend"
version = "0.1.0"
description = "LifeLink API — FastAPI auth gateway and platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "redis>=5.0",
    "rq>=1.16",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-boto3>=1.0.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  # UP042 (class X(str, Enum) -> StrEnum) is NOT a style-only change:
  # StrEnum.__str__ returns the value, (str, Enum).__str__ returns
  # "Class.MEMBER", so f-strings and logs across the codebase would change
  # output. Kept deliberately; revisit as a behaviour change, not a lint fix.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revision files are generated op.* call listings; wrapping them by
# hand adds risk to schema history for no readability gain.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
