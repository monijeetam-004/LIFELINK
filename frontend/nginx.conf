server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # QA round (2026-10-20): framing and sniffing protection for the SPA.
    # vite-csp-plugin.ts puts the CSP in a <meta> tag, where browsers ignore
    # frame-ancestors, and leaves framing protection to "whatever static host
    # serves dist/" -- which is this nginx in the shipped frontend image, and
    # it sent none, so the app could be framed (clickjacking). Repeated in
    # every location that sets its own add_header, because nginx does not
    # inherit add_header into such a location.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # client-side routes fall back to the SPA shell
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
